name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (z. B. v3.1.3)'
        required: false
        default: 'v3.1.3'

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone EXE & Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Run Unit & Integration Tests
        run: |
          python -X utf8 test_batch.py
          python -X utf8 test_new_features.py
          python -X utf8 test_ab_workflow.py

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Build Inno Setup Non-Admin Installer
        run: |
          python build_installer.py

      - name: Prepare Release Artifacts
        id: prepare_assets
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "dist/installer/*.exe" | Select-Object -First 1
          Write-Host "Installer found: $($setup.FullName)"
          
          # Create copy with clean naming for portable distribution
          Copy-Item "dist/GeminiTTSStudio.exe" "dist/GeminiTTSStudio-Portable.exe"

      - name: Generate Release Notes from Commits
        id: gen_notes
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          $commitsRaw = if ($prevTag) { git log --pretty=format:"%s" "$prevTag..HEAD" } else { git log -n 10 --pretty=format:"%s" }
          
          # Clean and Germanize conventional commit prefixes
          $cleanedCommits = @()
          foreach ($c in ($commitsRaw -split "`n")) {
              $line = $c.Trim()
              if (-not $line) { continue }
              $line = $line -replace '\s*\(v\d+\.\d+(\.\d+)?\)\s*$', ''
              $line = $line -replace '^(feat|feature)(\([^)]+\))?:\s*', '✨ Neu: '
              $line = $line -replace '^(fix|bugfix)(\([^)]+\))?:\s*', '🐛 Behoben: '
              $line = $line -replace '^(perf|performance)(\([^)]+\))?:\s*', '⚡ Optimierung: '
              $line = $line -replace '^(refactor|improve)(\([^)]+\))?:\s*', '🔧 Verbesserung: '
              $line = $line -replace '^(docs)(\([^)]+\))?:\s*', '📖 Dokumentation: '
              $line = $line -replace '^(style|ui)(\([^)]+\))?:\s*', '🎨 Design & UI: '
              $line = $line -replace '^(chore)(\([^)]+\))?:\s*', '⚙️ Wartung: '
              $cleanedCommits += "* $line"
          }
          $commitsText = $cleanedCommits -join "`n"

          if ($prevTag) {
              $content = "### 🚀 Neuerungen & Verbesserungen in dieser Version`n`n$commitsText`n`n---`n**Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...${{ github.ref_name }}"
          } else {
              $content = "### 🚀 Neuerungen & Verbesserungen in dieser Version`n`n$commitsText"
          }
          [System.IO.File]::WriteAllText("release_notes.md", $content, [System.Text.Encoding]::UTF8)

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/installer/GeminiTTSStudio-Setup-*.exe
            dist/GeminiTTSStudio-Portable.exe
          draft: false
          prerelease: false
          body_path: release_notes.md
